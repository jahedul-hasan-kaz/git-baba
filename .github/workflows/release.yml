name: Release

# Builds the Windows and macOS executables and attaches them to a GitHub Release.
# Any of these attaches the .exe and .dmg files to a release:
#   - publish a release on GitHub (Releases → Draft a new release),
#   - push a tag like v0.1.0,
#   - run it manually from Actions with the tag of an existing release.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach files to (e.g. v0.1.0). Leave empty to only build.
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned builds: no code-signing certificate is configured yet.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: git-baba-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
