name: Release

# How releasing works
#   1. Merge or push to the `release` branch.
#   2. This workflow picks the next version (patch by default), commits it to `release`, tags vX.Y.Z,
#      builds the Windows and macOS apps and publishes the GitHub Release with them attached.
#   3. The new version number is written back to `main`, so both branches agree.
#
# Need a minor or major version? Actions → Release → Run workflow, choose the bump.
# A tag pushed by hand (vX.Y.Z), a release published on GitHub, or a manual run with an existing tag
# still builds and attaches the files to that release, as before.
on:
  push:
    branches: [release]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: New version from the release branch (none = only build an existing tag below)
        type: choice
        options: [patch, minor, major, none]
        default: patch
      tag:
        description: With bump = none, the existing release tag to build and attach files to (e.g. v1.0.2)
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # New version: a push to the release branch, or a manual run with a bump.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/release') || (github.event_name == 'workflow_dispatch' && inputs.bump != 'none')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Work out the next version
        id: next
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          node -e '
            const cmp = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
            const parse = (v) => v.replace(/^v/, "").split(".").map(Number);
            const pkg = parse(require("./package.json").version);
            const tags = require("child_process").execSync("git tag --list \"v*\"").toString().split("\n")
              .filter((t) => /^v\d+\.\d+\.\d+$/.test(t)).map(parse);
            // Start from the highest of package.json and every existing tag, so a version is never reused.
            let base = [pkg, ...tags].reduce((m, v) => (cmp(v, m) > 0 ? v : m));
            const b = process.env.BUMP;
            const next = b === "major" ? [base[0] + 1, 0, 0] : b === "minor" ? [base[0], base[1] + 1, 0] : [base[0], base[1], base[2] + 1];
            const v = next.join(".");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `version=${v}\ntag=v${v}\n`);
            console.log(`Next version: ${v} (${b})`);
          '
      - name: Commit and tag the version on release
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:release "v$VERSION"
      - name: Write the version back to main
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if git diff --quiet; then echo "main already has $VERSION"; exit 0; fi
          git add package.json package-lock.json
          git commit -m "chore: version $VERSION (released from release)"
          git push origin main

  build:
    needs: version
    # Runs after a new version, and on its own for a pushed tag, a published release or a manual tag run.
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned builds: no code-signing certificate is configured yet.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: git-baba-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    needs: [version, build]
    if: always() && needs.build.result == 'success' && (needs.version.outputs.tag != '' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag || github.event.release.tag_name || inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
